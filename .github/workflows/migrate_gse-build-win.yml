name: "Build migrate_gse script (Windows)"

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag name for the release (e.g., 'nightly' or 'release-1.0.0')"
        required: false
        type: string
      prerelease:
        description: "Whether this is a prerelease"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name for the release (leave empty for no release)"
        required: false
        type: string
      prerelease:
        description: "Whether this is a prerelease"
        required: false
        type: boolean
        default: true

permissions:
  contents: "write"

env:
  SCRIPT_BASE_DIR: "tools/migrate_gse"
  PACKAGE_BASE_DIR: "tools/migrate_gse/bin/win"
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  build:
    runs-on: [self-hosted, windows, x64, gbe-build]

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      # extra helpers/tools, these are not built inside the deps build dir
      - name: "Clone third-party deps (build/win)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/build/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/build/win"

      - name: "Clone third-party deps (deps/win)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/deps/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/win"

      - name: "Add Python to PATH"
        shell: pwsh
        run: |
          echo "C:\Python312" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "C:\Python312\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: "Verify Python"
        shell: cmd
        run: python --version

      - name: "Install env"
        shell: cmd
        working-directory: "${{ env.SCRIPT_BASE_DIR }}"
        run: recreate_venv_win.bat

      - name: "Rebuild"
        shell: cmd
        working-directory: "${{ env.SCRIPT_BASE_DIR }}"
        run: rebuild_win.bat

      # package
      - name: "Package script"
        shell: cmd
        working-directory: "${{ env.SCRIPT_BASE_DIR }}"
        run: package_win.bat

      - name: "List packaged files"
        shell: cmd
        run: |
          echo === Packaged files ===
          dir tools\migrate_gse\bin\package\win\ 2>nul || echo No packaged files found

      # upload to release
      - name: "Upload to Release"
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: tools/migrate_gse/bin/package/win/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
