name: "Nightly Release"

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger for testing

permissions:
  contents: "write"

env:
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  # Build Windows
  emu-win-all:
    name: "Emu win all"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-build-all-win.yml"

  # Build Linux
  emu-linux-all:
    name: "Emu linux all"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-build-all-linux.yml"

  # Package and release Windows
  emu-win-prep:
    needs: ["emu-win-all"]
    runs-on: "windows-2022"
    steps:
      - name: "Ensure LF line ending"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          git config --local core.autocrlf false
          git config --system core.autocrlf false
          git config --global core.autocrlf false

      - name: "Checkout branch"
        uses: actions/checkout@v4

      - name: "Clone third-party deps (deps/win)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/deps/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/win"

      - name: "Download emu build artifacts (Win)"
        uses: actions/download-artifact@v4
        with:
          path: "build/win"
          pattern: "emu-win-*-${{ github.sha }}"
          merge-multiple: true

      - name: "Print files"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          dir /s /b /a:-d build\win

      - name: "Package build (release)"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: package_win.bat vs2022\release

      - name: "Upload Windows release package"
        uses: actions/upload-artifact@v4
        with:
          name: "nightly-emu-win-release"
          path: "build/package/win/vs2022/*release*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 1

  # Package and release Linux
  emu-linux-prep:
    needs: ["emu-linux-all"]
    runs-on: "ubuntu-22.04"
    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      - name: "Clone third-party deps (deps/linux)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/deps/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/linux"

      - name: "Download emu build artifacts (linux)"
        uses: actions/download-artifact@v4
        with:
          path: "build/linux"
          pattern: "emu-linux-*-${{ github.sha }}"
          merge-multiple: true

      - name: "Give all permissions to repo folder"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: sudo chmod -R 777 "${{ github.workspace }}" && sudo chmod 777 package_linux.sh

      - name: "Print files"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          ls -la build/linux/*/*

      - name: "Download required Ubuntu packages"
        shell: "bash"
        run: |
          sudo apt update || exit 1
          sudo apt install tar -y || exit 1

      - name: "Package build (release)"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: ./package_linux.sh gmake2/release

      - name: "Upload Linux release package"
        uses: actions/upload-artifact@v4
        with:
          name: "nightly-emu-linux-release"
          path: "build/package/linux/gmake2/*release*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 1

  # Create/update nightly release
  create-nightly-release:
    needs: ["emu-win-prep", "emu-linux-prep"]
    runs-on: "ubuntu-22.04"
    steps:
      - name: "Download Windows artifacts"
        uses: actions/download-artifact@v4
        with:
          name: "nightly-emu-win-release"
          path: "artifacts/win"

      - name: "Download Linux artifacts"
        uses: actions/download-artifact@v4
        with:
          name: "nightly-emu-linux-release"
          path: "artifacts/linux"

      - name: "List artifacts"
        run: |
          echo "=== Windows ==="
          ls -la artifacts/win/
          echo "=== Linux ==="
          ls -la artifacts/linux/

      - name: "Delete existing nightly release"
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: "nightly"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
        continue-on-error: true

      - name: "Create nightly release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly"
          name: "Nightly Build"
          body: |
            Automatic nightly build from `dev` branch.

            **Built:** ${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
            **Commit:** ${{ github.sha }}

            ⚠️ This is an automated build and may be unstable.
            For stable releases, use tagged versions.

            ## Includes
            - `steamnetworkingsockets` library for games using GameNetworkingSockets.dll
          prerelease: true
          files: |
            artifacts/win/*
            artifacts/linux/*
