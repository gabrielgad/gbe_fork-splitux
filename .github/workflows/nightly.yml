name: "Nightly Release"

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: "write"

jobs:
  # Delete existing nightly release first
  cleanup-nightly:
    name: "Cleanup existing nightly"
    runs-on: "ubuntu-22.04"
    steps:
      - name: "Delete existing nightly release"
        run: |
          gh release delete nightly --yes --repo ${{ github.repository }} || true
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/nightly || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Linux - creates the release and uploads Linux build
  emu-linux-all:
    name: "Emu linux all"
    needs: ["cleanup-nightly"]
    uses: "./.github/workflows/emu-build-all-linux.yml"
    with:
      release_tag: "nightly"
      prerelease: true

  # Build Windows - appends Windows build to the release
  emu-win-all:
    name: "Emu win all"
    needs: ["emu-linux-all"]
    uses: "./.github/workflows/emu-build-all-win.yml"
    with:
      release_tag: "nightly"
      prerelease: true

  # Build migrate_gse scripts
  migrate_gse-linux:
    name: "Migrate GSE linux"
    needs: ["emu-win-all"]
    uses: "./.github/workflows/migrate_gse-build-linux.yml"
    with:
      release_tag: "nightly"
      prerelease: true

  migrate_gse-win:
    name: "Migrate GSE win"
    needs: ["migrate_gse-linux"]
    uses: "./.github/workflows/migrate_gse-build-win.yml"
    with:
      release_tag: "nightly"
      prerelease: true
