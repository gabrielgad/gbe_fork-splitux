name: "Build emu (Linux)"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: "write"

env:
  PREMAKE_ACTION: "gmake2"
  LOCAL_DEPS_DIR: "/home/runner/gbe-deps"
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  deps:
    name: "Restore or build deps"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-deps-linux.yml"

  build-all-linux:
    name: "build-all"
    needs: ["deps"]
    runs-on: [self-hosted, Linux, X64]
    if: ${{ !cancelled() }}

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4
        with:
          clean: false

      - name: "Link local deps"
        run: |
          mkdir -p build/deps/linux
          rm -rf build/deps/linux/gmake2
          ln -s "$LOCAL_DEPS_DIR/gmake2" build/deps/linux/gmake2
          echo "Linked deps from $LOCAL_DEPS_DIR"

      - name: "Clone third-party build helpers (common/linux)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/common/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/linux"

      - name: "Clone third-party build helpers (build/linux)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/build/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/build/linux"

      - name: "Generate project files"
        working-directory: "${{ github.workspace }}"
        run: |
          chmod +x ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5.lua --genproto --emubuild=${{ github.sha }} --os=linux gmake2

      - name: "Build api_regular x64"
        working-directory: "${{ github.workspace }}/build/project/gmake2/linux"
        run: make -j$(nproc) config=release_x64 api_regular

      - name: "Upload release package"
        uses: actions/upload-artifact@v4
        with:
          name: "emu-linux-release-${{ github.sha }}"
          path: "build/linux"
          if-no-files-found: "error"
          compression-level: 6
          retention-days: 1
