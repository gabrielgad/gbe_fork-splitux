name: "Build emu (Linux)"

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag name for the release (e.g., 'nightly' or 'release-1.0.0')"
        required: false
        type: string
      prerelease:
        description: "Whether this is a prerelease"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name for the release (leave empty for no release)"
        required: false
        type: string
      prerelease:
        description: "Whether this is a prerelease"
        required: false
        type: boolean
        default: true

permissions:
  contents: "write"

env:
  PREMAKE_ACTION: "gmake"
  LOCAL_DEPS_DIR: "/home/runner/gbe-deps"
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  deps:
    name: "Restore or build deps"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-deps-linux.yml"

  build-and-release:
    name: "Build, package, and release"
    needs: ["deps"]
    runs-on: [self-hosted, Linux, X64, splitux]
    if: ${{ !cancelled() }}

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4
        with:
          clean: false

      - name: "Link local deps"
        run: |
          mkdir -p build/deps/linux
          rm -rf build/deps/linux/gmake build/deps/linux/gmake2
          ln -s "$LOCAL_DEPS_DIR/gmake2" build/deps/linux/gmake
          echo "Linked deps from $LOCAL_DEPS_DIR/gmake2 -> build/deps/linux/gmake (premake5 v5.0.0-beta8 renamed gmake2 -> gmake)"

      - name: "Clone third-party build helpers (common/linux)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/common/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/linux"

      - name: "Clone third-party build helpers (build/linux)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/build/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/build/linux"

      - name: "Clone third-party deps (deps/linux)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/deps/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/linux"

      - name: "Generate project files"
        working-directory: "${{ github.workspace }}"
        run: |
          chmod +x ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5.lua --genproto --emubuild=${{ github.sha }} --os=linux gmake

      - name: "Build all targets"
        working-directory: "${{ github.workspace }}/build/project/gmake/linux"
        run: |
          for prj in api_regular steamclient_regular api_experimental steamclient_experimental tool_lobby_connect tool_generate_interfaces; do
            for arch in x64 x32; do
              echo "=== Building $prj ($arch, release) ==="
              make -j4 config=release_$arch $prj || echo "Warning: $prj $arch release build failed"
            done
          done

      - name: "Package build (release)"
        working-directory: "${{ github.workspace }}"
        run: |
          chmod +x package_linux.sh
          ./package_linux.sh gmake/release

      - name: "List packaged files"
        run: |
          echo "=== Packaged files ==="
          ls -la build/package/linux/gmake/ || echo "No packaged files found"

      - name: "Upload to Release"
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag == 'nightly' && 'Nightly Build' || inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          body: |
            ${{ inputs.release_tag == 'nightly' && format('Automatic nightly build from `dev` branch.

            **Commit:** {0}

            This is an automated build and may be unstable.
            For stable releases, use tagged versions.

            ## Includes
            - `steamnetworkingsockets` library for games using GameNetworkingSockets.dll', github.sha) || '' }}
          files: build/package/linux/gmake/*release*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
