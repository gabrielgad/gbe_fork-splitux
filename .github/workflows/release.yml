name: "Prepare release"

on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name for the release (leave empty to use branch name)"
        required: false
        type: string

permissions:
  contents: "write"

jobs:
  # Build Linux - creates the release and uploads Linux build
  emu-linux-all:
    name: "Emu linux all"
    uses: "./.github/workflows/emu-build-all-linux.yml"
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      prerelease: false

  # Build Windows - appends Windows build to the release
  emu-win-all:
    name: "Emu win all"
    needs: ["emu-linux-all"]
    uses: "./.github/workflows/emu-build-all-win.yml"
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      prerelease: false

  # Build migrate_gse Linux
  migrate_gse-linux:
    name: "Migrate GSE linux"
    needs: ["emu-win-all"]
    uses: "./.github/workflows/migrate_gse-build-linux.yml"
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      prerelease: false

  # Build migrate_gse Windows
  migrate_gse-win:
    name: "Migrate GSE win"
    needs: ["migrate_gse-linux"]
    uses: "./.github/workflows/migrate_gse-build-win.yml"
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      prerelease: false
