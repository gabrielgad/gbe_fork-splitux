name: "Build migrate_gse script (Linux)"

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag name for the release (e.g., 'nightly' or 'release-1.0.0')"
        required: false
        type: string
      prerelease:
        description: "Whether this is a prerelease"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name for the release (leave empty for no release)"
        required: false
        type: string
      prerelease:
        description: "Whether this is a prerelease"
        required: false
        type: boolean
        default: true

permissions:
  contents: "write"

env:
  SCRIPT_BASE_DIR: "tools/migrate_gse"
  PACKAGE_BASE_DIR: "tools/migrate_gse/bin/linux"

jobs:
  build:
    runs-on: "ubuntu-22.04"

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      # fix folder permissions! not sure why this fails
      # nested subdirs "build/linux/release" cause permission problems
      - name: "Give all permissions to repo folder"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: sudo chmod -R 777 "${{ github.workspace }}"

      # env
      - name: "Install env"
        shell: "bash"
        working-directory: "${{ env.SCRIPT_BASE_DIR }}"
        run: sudo chmod 777 recreate_venv_linux.sh && sudo ./recreate_venv_linux.sh

      # build
      - name: "Rebuild"
        shell: "bash"
        working-directory: "${{ env.SCRIPT_BASE_DIR }}"
        run: sudo chmod 777 rebuild_linux.sh && ./rebuild_linux.sh

      # package
      - name: "Package script"
        shell: "bash"
        working-directory: "${{ env.SCRIPT_BASE_DIR }}"
        run: sudo chmod 777 package_linux.sh && sudo ./package_linux.sh

      - name: "List packaged files"
        run: |
          echo "=== Packaged files ==="
          ls -la tools/migrate_gse/bin/package/linux/ || echo "No packaged files found"

      # upload to release
      - name: "Upload to Release"
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: tools/migrate_gse/bin/package/linux/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
