name: "Build emu (Windows)"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: "write"

env:
  PREMAKE_ACTION: "vs2022"
  LOCAL_DEPS_DIR: "C:\\gbe-deps"
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  deps:
    name: "Restore or build deps"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-deps-win.yml"

  build-all-win:
    name: "build-all"
    needs: ["deps"]
    runs-on: [self-hosted, windows, x64]
    if: ${{ !cancelled() }}

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4
        with:
          clean: false  # Preserve build artifacts between runs

      - name: "Setup MSBuild"
        uses: microsoft/setup-msbuild@v2

      - name: "Link local deps"
        shell: cmd
        run: |
          if not exist "build\deps\win" mkdir "build\deps\win"
          if exist "build\deps\win\vs2022" rmdir /s /q "build\deps\win\vs2022"
          mklink /J "build\deps\win\vs2022" "%LOCAL_DEPS_DIR%\vs2022"
          echo Linked deps from %LOCAL_DEPS_DIR%

      - name: "Clone third-party build helpers (common/win)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/common/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/win"

      - name: "Clone third-party deps (build/win)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/build/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/build/win"

      - name: "Generate project files"
        shell: cmd
        working-directory: "${{ github.workspace }}"
        run: |
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5.lua --genproto --emubuild=${{ github.sha }} --dosstub --winrsrc --winsign --os=windows vs2022

      - name: "Build api_regular x64"
        shell: cmd
        working-directory: "${{ github.workspace }}/build/project/vs2022/win"
        run: msbuild /nologo /t:api_regular /m /v:m /p:Configuration=release,Platform=x64 gbe.sln

      - name: "Build api_regular Win32"
        shell: cmd
        working-directory: "${{ github.workspace }}/build/project/vs2022/win"
        run: msbuild /nologo /t:api_regular /m /v:m /p:Configuration=release,Platform=Win32 gbe.sln

      - name: "Build lib_steamnetworkingsockets x64"
        shell: cmd
        working-directory: "${{ github.workspace }}/build/project/vs2022/win"
        run: msbuild /nologo /t:lib_steamnetworkingsockets /m /v:m /p:Configuration=release,Platform=x64 gbe.sln

      - name: "Build lib_steamnetworkingsockets Win32"
        shell: cmd
        working-directory: "${{ github.workspace }}/build/project/vs2022/win"
        run: msbuild /nologo /t:lib_steamnetworkingsockets /m /v:m /p:Configuration=release,Platform=Win32 gbe.sln

      - name: "Upload release package"
        uses: actions/upload-artifact@v4
        with:
          name: "emu-win-release-${{ github.sha }}"
          path: "build/win"
          if-no-files-found: "error"
          compression-level: 6
          retention-days: 1
