name: "Build emu (Windows)"

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag name for the release (e.g., 'nightly' or 'release-1.0.0')"
        required: false
        type: string
      prerelease:
        description: "Whether this is a prerelease"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name for the release (leave empty for no release)"
        required: false
        type: string
      prerelease:
        description: "Whether this is a prerelease"
        required: false
        type: boolean
        default: true

permissions:
  contents: "write"

env:
  PREMAKE_ACTION: "vs2022"
  LOCAL_DEPS_DIR: "C:\\gbe-deps"
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  deps:
    name: "Restore or build deps"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-deps-win.yml"

  build-and-release:
    name: "Build, package, and release"
    needs: ["deps"]
    runs-on: [self-hosted, Windows, X64, splitux]
    if: ${{ !cancelled() }}

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4
        with:
          clean: false

      - name: "Setup MSBuild"
        uses: microsoft/setup-msbuild@v2

      - name: "Link local deps"
        shell: cmd
        run: |
          if not exist "build\deps\win" mkdir "build\deps\win"
          if exist "build\deps\win\vs2022" rmdir /s /q "build\deps\win\vs2022"
          mklink /J "build\deps\win\vs2022" "%LOCAL_DEPS_DIR%\vs2022"
          echo Linked deps from %LOCAL_DEPS_DIR%

      - name: "Clone third-party build helpers (common/win)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/common/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/win"

      - name: "Clone third-party deps (build/win)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/build/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/build/win"

      - name: "Clone third-party deps (deps/win)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/deps/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/win"

      - name: "Generate project files"
        shell: cmd
        working-directory: "${{ github.workspace }}"
        run: |
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5.lua --genproto --emubuild=${{ github.sha }} --dosstub --winrsrc --winsign --os=windows vs2022

      - name: "Build all targets"
        shell: cmd
        working-directory: "${{ github.workspace }}/build/project/vs2022/win"
        run: |
          @echo off
          setlocal enabledelayedexpansion

          rem The build job checks out with clean:false, so stale DLLs from a prior
          rem build linger. Wipe the release output dir first so a target that fails
          rem to build this run cannot ship a leftover DLL (false success).
          if exist "%GITHUB_WORKSPACE%\build\win\vs2022\release" rmdir /s /q "%GITHUB_WORKSPACE%\build\win\vs2022\release"

          for %%P in (api_regular api_experimental steamclient_experimental_stub steamclient_experimental steamclient_experimental_loader steamclient_experimental_extra lib_game_overlay_renderer lib_steamnetworkingsockets tool_lobby_connect tool_generate_interfaces) do (
            for %%A in (x64 Win32) do (
              echo === Building %%P [%%A release] ===
              msbuild /nologo /t:%%P /m /v:m /p:Configuration=release,Platform=%%A gbe.sln
              if errorlevel 1 echo Warning: %%P %%A release build failed
            )
          )

          echo === Building lib_steam_old (Win32 only) ===
          msbuild /nologo /t:lib_steam_old /m /v:m /p:Configuration=release,Platform=Win32 gbe.sln
          if errorlevel 1 echo Warning: lib_steam_old Win32 release build failed

          rem Per-target failures above are warn-only (e.g. signing of a dev-only tool,
          rem or lib_steam_old). Don't let them abort the job here; the next step gates
          rem the release on the actual shippable DLLs existing.
          exit /b 0

      - name: "Verify shippable DLLs built"
        shell: cmd
        working-directory: "${{ github.workspace }}"
        run: |
          setlocal enabledelayedexpansion
          set "OUT=%GITHUB_WORKSPACE%\build\win\vs2022\release"
          set "MISSING="
          for %%F in (
            "regular\x64\steam_api64.dll"
            "regular\x86\steam_api.dll"
            "experimental\x64\steam_api64.dll"
            "experimental\x86\steam_api.dll"
          ) do (
            if exist "%OUT%\%%~F" ( echo OK: %%~F ) else ( echo MISSING: %%~F & set "MISSING=1" )
          )
          if defined MISSING (
            echo One or more shippable steam_api DLLs are missing - failing the build.
            exit /b 1
          )
          echo All shippable steam_api DLLs present.

      - name: "Package build (release)"
        shell: cmd
        working-directory: "${{ github.workspace }}"
        run: package_win.bat vs2022\release

      - name: "List packaged files"
        shell: cmd
        run: |
          echo === Packaged files ===
          dir build\package\win\vs2022\ 2>nul || echo No packaged files found

      - name: "Upload to Release"
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: build/package/win/vs2022/*release*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
