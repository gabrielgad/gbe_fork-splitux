name: "Emu third-party dependencies (Windows)"

on:
  workflow_call:
    inputs:
      force_rebuild:
        description: "Wipe the local deps cache and rebuild from scratch"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Wipe the local deps cache and rebuild from scratch"
        required: false
        type: boolean
        default: false

permissions:
  contents: "write"

env:
  PREMAKE_ACTION: "vs2022"
  # Local persistent path for self-hosted runner
  LOCAL_DEPS_DIR: "C:\\gbe-deps"
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  deps-build:
    runs-on: [self-hosted, Windows, X64, splitux]
    if: ${{ !cancelled() }}

    steps:
      - name: "Check if deps already built locally"
        id: "local-deps-check"
        shell: cmd
        run: |
          if /I "${{ inputs.force_rebuild }}"=="true" (
            echo Force rebuild requested - wiping %LOCAL_DEPS_DIR%\vs2022
            if exist "%LOCAL_DEPS_DIR%\vs2022" rmdir /s /q "%LOCAL_DEPS_DIR%\vs2022"
          )
          rem Require markers from multiple deps, not just protobuf: a partial cache
          rem (e.g. protobuf present but zlibstatic.lib missing) used to pass this
          rem check and never refresh, which broke api_regular linking. Treat a
          rem missing critical lib as "needs rebuild".
          set DEPS_OK=1
          if not exist "%LOCAL_DEPS_DIR%\vs2022\protobuf\install64" set DEPS_OK=0
          if not exist "%LOCAL_DEPS_DIR%\vs2022\zlib\install64\lib\zlibstatic.lib" set DEPS_OK=0
          if "%DEPS_OK%"=="1" (
            echo deps_exist=true>>%GITHUB_OUTPUT%
            echo Deps already exist and look complete at %LOCAL_DEPS_DIR%
          ) else (
            echo deps_exist=false>>%GITHUB_OUTPUT%
            echo Deps missing or incomplete, will build
          )

      - name: "Checkout branch"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        uses: actions/checkout@v4

      - name: "Setup MSBuild"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: "Clone third-party deps (common/win)"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        uses: actions/checkout@v4
        with:
          ref: "third-party/common/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/win"

      - name: "Clone third-party deps (deps/win)"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        uses: actions/checkout@v4
        with:
          ref: "third-party/deps/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/win"

      - name: "Clone third-party deps (deps/common)"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        uses: actions/checkout@v4
        with:
          ref: "third-party/deps/common"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/common"

      - name: "Build deps"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        shell: cmd
        working-directory: "${{ github.workspace }}"
        run: |
          set "CMAKE_GENERATOR=Visual Studio 17 2022"
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5-deps.lua --64-build --32-build --all-ext --all-build --j=2 --verbose --os=windows vs2022

      - name: "Copy deps to local cache"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        shell: cmd
        run: |
          if not exist "%LOCAL_DEPS_DIR%" mkdir "%LOCAL_DEPS_DIR%"
          xcopy /E /I /Y "build\deps\win\vs2022" "%LOCAL_DEPS_DIR%\vs2022"
          echo Deps cached to %LOCAL_DEPS_DIR%
