name: "Emu third-party dependencies (Linux)"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: "write"

env:
  PREMAKE_ACTION: "gmake2"
  LOCAL_DEPS_DIR: "/home/runner/gbe-deps"
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  deps-build:
    runs-on: [self-hosted, Linux, X64, splitux]
    if: ${{ !cancelled() }}

    steps:
      - name: "Check if deps already built locally"
        id: "local-deps-check"
        run: |
          if [ -d "$LOCAL_DEPS_DIR/gmake2/protobuf/install64" ]; then
            echo "deps_exist=true" >> $GITHUB_OUTPUT
            echo "Deps already exist at $LOCAL_DEPS_DIR"
          else
            echo "deps_exist=false" >> $GITHUB_OUTPUT
            echo "Deps not found, will build"
          fi

      - name: "Checkout branch"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        uses: actions/checkout@v4

      - name: "Clone third-party deps (common/linux)"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        uses: actions/checkout@v4
        with:
          ref: "third-party/common/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/linux"

      - name: "Clone third-party deps (deps/linux)"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        uses: actions/checkout@v4
        with:
          ref: "third-party/deps/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/linux"

      - name: "Clone third-party deps (deps/common)"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        uses: actions/checkout@v4
        with:
          ref: "third-party/deps/common"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/common"

      - name: "Build deps"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        working-directory: "${{ github.workspace }}"
        run: |
          export CMAKE_GENERATOR="Unix Makefiles"
          chmod +x ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5-deps.lua --64-build --all-ext --all-build --j=$(nproc) --verbose --os=linux gmake2

      - name: "Copy deps to local cache"
        if: steps.local-deps-check.outputs.deps_exist != 'true'
        run: |
          mkdir -p "$LOCAL_DEPS_DIR"
          cp -r build/deps/linux/gmake2 "$LOCAL_DEPS_DIR/"
          echo "Deps cached to $LOCAL_DEPS_DIR"
